name: Build Forge 1.20.1 JAR
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build Forge JAR
        run: gradle --no-daemon clean build --console=plain
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Injaa-Instant-Transmission-Forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
